<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchemaLens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='11' height='9' rx='2' fill='%234f6bed'/%3E%3Crect x='18' y='18' width='11' height='9' rx='2' fill='%234f6bed'/%3E%3Cpath d='M14 10h4a2 2 0 0 1 2 2v6' stroke='%234f6bed' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="db">
        <div class="brand">SchemaLens</div>
        <h1 id="db-name">Loading…</h1>
        <div id="db-meta" class="muted small"></div>
        <div class="status-row">
          <span id="status-dot" class="dot"></span>
          <span id="status-text" class="small">Connecting…</span>
          <button id="refresh" class="small-button" title="Re-read the database now">Refresh</button>
        </div>
      </header>

      <input id="search" type="search" placeholder="Filter tables  ( / )" autocomplete="off" spellcheck="false">

      <section class="panel">
        <h2>Tables <span id="table-count" class="count"></span></h2>
        <ul id="table-list" class="table-list"></ul>
      </section>

      <section class="panel">
        <h2>Findings <span id="finding-count" class="count"></span></h2>
        <div id="findings"></div>
      </section>
    </aside>

    <main class="stage">
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="What each table shows">
          <button id="mode-names" type="button">Names only</button>
          <button id="mode-columns" type="button">Show columns</button>
        </div>
        <label class="small">Layout
          <select id="layout">
            <option value="dagre">Hierarchy</option>
            <option value="cose">Force</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="fit" type="button" title="Fit the whole graph on screen">Fit</button>
        <button id="png" type="button" title="Download the current view as a PNG">PNG</button>
        <a id="mermaid" class="button" href="/api/export/mermaid?download=1" title="Download a Mermaid ER diagram">Mermaid</a>
      </div>

      <div id="graph" aria-label="Table relationship graph"></div>

      <div class="legend small">
        <span><i class="line solid"></i>foreign key</span>
        <span><i class="line dashed"></i>guessed from name</span>
        <span><i class="box high"></i>high finding</span>
        <span><i class="box medium"></i>medium finding</span>
        <span class="muted">🔑 PK · 🔗 FK · U unique · ? nullable</span>
      </div>

      <div id="empty" class="empty" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>

    <aside id="details" class="details" hidden>
      <button id="close-details" class="close" type="button" aria-label="Close details">×</button>
      <div id="details-body"></div>
    </aside>
  </div>
</body>
</html>
