# Postgres 16 with the SchemaLens demo shop preloaded.
# The .sql file only runs the first time the volume is created;
# `make db-reset` throws the volume away to load it again.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: schemalens
      POSTGRES_PASSWORD: schemalens
      POSTGRES_DB: shop
    ports:
      - "5433:5432"   # 5433 so it doesn't fight a Postgres already on 5432
    volumes:
      - ./testdata/sample_schema.sql:/docker-entrypoint-initdb.d/01_sample_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemalens -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
